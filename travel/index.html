<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel</title>
  <meta name="description" content="Road trip plans with maps, stops and forecasts.">
  <style>
    :root {
      --bg: #faf6ef; --panel: #ffffff; --ink: #2a2118; --muted: #6b5d4f;
      --line: #e6dccd; --accent: #b4441c; --soft: #f3ebdf;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17130f; --panel: #211b16; --ink: #f1e9df; --muted: #b9aa98;
        --line: #3a3027; --accent: #f08a5d; --soft: #2b231c; color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); }
    .wrap { max-width: 900px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    header { padding-block: 28px 8px; }
    .home { font-size: 0.9rem; text-decoration: none; }
    .home:hover { text-decoration: underline; }
    h1 { margin: 6px 0 4px; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -0.02em; }
    .lede { margin: 0; color: var(--muted); }
    .trips { list-style: none; margin: 24px 0 48px; padding: 0; display: grid; gap: 14px; }
    .trip {
      display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; text-decoration: none; color: inherit;
    }
    .trip:hover, .trip:focus-visible { border-color: var(--accent); }
    .trip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .thumb {
      height: 80px; border-radius: 8px;
      background: linear-gradient(135deg, #b4441c 0%, #d9822b 55%, #e9b65b 100%);
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.6rem;
    }
    .trip h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .trip p { margin: 0; color: var(--muted); font-size: 0.93rem; }
    .meta { margin-top: 6px !important; font-size: 0.85rem !important; }
    @media (max-width: 520px) { .trip { grid-template-columns: 1fr; } .thumb { height: 64px; } }
  </style>
</head>
<body>
  <header class="wrap">
    <a class="home" href="/">&larr; Home</a>
    <h1>Travel</h1>
    <p class="lede">Road trip plans with maps, stops, hotels and forecasts.</p>
  </header>
  <main class="wrap">
    <ul class="trips">
      <li>
        <a class="trip" href="southwest-road-trip/">
          <span class="thumb" aria-hidden="true">8 days</span>
          <span>
            <h2>Southwest Family Road Trip</h2>
            <p>Austin to the Grand Canyon, Page, Antelope Canyon and White Sands, and back.</p>
            <p class="meta">Amarillo &middot; Albuquerque &middot; Sedona &middot; Grand Canyon &middot; Page &middot; Gallup &middot; White Sands &middot; Roswell</p>
          </span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
