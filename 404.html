<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  :root{ --bg:#f6f3ec; --ink:#221f1a; --muted:#6c655b; --clay:#b5563a }
  @media (prefers-color-scheme: dark){ :root{ --bg:#18170f; --ink:#efe9dd; --muted:#a89f8e; --clay:#e08361 } }
  html,body{ margin:0; height:100% }
  body{ background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px }
  h1{ font-family:Georgia,serif; font-size:clamp(2.4rem,8vw,4rem); margin:0 0 8px }
  p{ color:var(--muted); margin:0 0 20px }
  a{ color:var(--clay); font-weight:600; text-decoration:none }
</style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>That page doesn't exist here.</p>
    <a href="./">&larr; Back to the home page</a>
  </div>
</body>
</html>
